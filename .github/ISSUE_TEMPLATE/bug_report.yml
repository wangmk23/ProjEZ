name: 问题反馈
description: 报告可复现的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请先检查最新版本。截图和日志须隐藏桌面、邮箱、真实窗口标题、个人路径与设备序列号。"
  - type: input
    id: version
    attributes:
      label: ProjEZ 版本
      placeholder: "例如 0.7.7"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 测试环境
      description: Windows 版本、核显/独显、来源/目标分辨率、GPU 或 GDI；无需设备序列号。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充材料（可选，需去除个人信息）
